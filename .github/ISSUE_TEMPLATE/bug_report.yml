name: Bug report
description: Report a reproducible problem in Elasticsearch SDK
title: "[Bug]: "
labels: [ bug ]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Explain the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include concise code or steps. Remove credentials and sensitive data.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Library, Java, and Elasticsearch versions.
    validations:
      required: true
